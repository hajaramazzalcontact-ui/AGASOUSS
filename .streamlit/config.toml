# Streamlit Configuration for AZUL AGADIR

[theme]
primaryColor = "#0E6BA8"          # Bleu océan
backgroundColor = "#FBF8F2"       # Sable clair
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2433"             # Texte noir
font = "sans serif"

# Mode sombre personnalisé
[theme.dark]
primaryColor = "#14B8A6"          # Turquoise
backgroundColor = "#0E1523"       # Bleu nuit
secondaryBackgroundColor = "#172033"
textColor = "#FFFFFF"

[client]
showErrorDetails = true
toolbarMode = "viewer"
showSidebarNavigation = true

[server]
headless = true
runOnSave = true
maxUploadSize = 200

[logger]
level = "info"

[browser]
gatherUsageStats = false          # Pas de tracking

[deprecation]
showPyplotGlobalUse = false

# Cache streamlit
[cache]
maxEntries = 1000
ttlSeconds = 3600
